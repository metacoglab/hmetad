    - metacognitive_bias_rvars
    - add_metacognitive_bias_rvars
    - type1_draws
    - add_type1_draws
    - type1_rvars
    - add_type1_rvars
    - type2_draws
    - add_type2_draws
    - type2_rvars
    - add_type2_rvars
    - roc1_draws
