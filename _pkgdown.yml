url: https://metacoglab.github.io/hmetad/
template:
  bootstrap: 5
  light-switch: true
  math-rendering: katex
  bootswatch: brite
  includes:
    in_header: |
      <meta name="google-site-verification" content="iiir4yUeAhnMJ1Li5Q7z796I_3JkBmSfwAaipMRMSOo" />

home:
  title: "hmetad: an R package for hierarchical Bayesian modeling of confidence ratings"
  description: >
    Implementation of Bayesian regressions over the meta-d' model of
    psychological data from two alternative forced choice tasks with
    ordinal confidence ratings. For more information, see Maniscalco & Lau (2012).
    The package is a front-end to the 'brms' package, which facilitates a wide
    range of regression designs, as well as tools for efficiently extracting
    posterior estimates, plotting, and significance testing.

reference:
  - title: Fitting the meta-d' model
    desc: >
      Run the meta-d' model on aggregated or non-aggregated data using `brms`
    contents:
    - fit_metad
    - metad
    - metac2_parameters
    - stanvars_metad

  - title: Processing data for model fitting
    desc: >
      Transform data between common formats used in metacognition research
    contents:
    - to_signed
    - to_unsigned
    - joint_response
    - type1_response
    - type2_response
    - aggregate_metad
    - type1_probabilities
    - type2_probabilities
    - joint_probabilities
    - roc1
    - roc2
    - auroc1
    - auroc2
    - mean_confidence

  - title: Extracting model estimates
